# cargo-mutants configuration (https://mutants.rs/). How to run it and how to
# read the results: CLAUDE.md, "Mutation testing". Policy: docs/decisions.md.

# Run the whole workspace's tests for every mutant. Many modules are tested
# from other crates (lonca-audit only from lonca-daemon/tests/audit.rs,
# lonca-policy chain/state from tests/decide.rs, most of lonca-core from
# downstream crates), so per-package testing reports false survivors. A
# workspace run is about 200 s on a CI runner, which a mutant pays in full if
# it survives. So on a pull request this setting is the second stage: the first
# passes `--test-workspace=false`, and only what that leaves comes here.
test_workspace = true

# `cargo test` runs one crate after another, so a mutant in a crate late in the
# alphabet waits for all the others before its own tests can catch it. nextest
# runs them side by side and stops at the first failure, so only a survivor
# pays for a whole run. It runs no doctests; the workspace has none.
test_tool = "nextest"

# `--in-diff` measures the baseline with `--package` of the changed crates only,
# while every mutant runs the whole workspace (`test_workspace`). For a PR on
# one crate the baseline is ~1 s, so the auto timeout falls to this minimum.
# A timeout counts as caught, so this must clear a whole run with room to spare,
# or a survivor on a busy runner passes as caught: 600 s is three times the
# ~200 s of a workspace run. A mutant that hangs the daemon or a socket test
# still ends as a timeout.
timeout_multiplier = 5.0
minimum_test_timeout = 600

# Mutants that are equivalent (no behaviour can tell them apart) or
# irrelevant. Every entry needs a comment saying why. Nothing in decide.rs,
# chain.rs, state.rs, oplog.rs, canonical.rs, changeid.rs or keys.rs is
# excluded without review.
#
# cargo-mutants 27.1.0 does not apply exclude_re (or --re) to "delete field
# ... from struct expression" mutants; exclude those with exclude_globs or
# kill them with a test.
exclude_re = [
  # `lonca run` ending its session: the guard tells "already over" from any
  # other failure, which only a daemon gone in the middle of a run produces,
  # and all that changes then is a line on stderr.
  'replace match guard mcp::session_over\(&e\) with true in finish',
  # One millisecond more or less of the grace after SIGTERM: not observable.
  'replace > with >= in wait',
  # `setsid` in the forked child: it fails only for a group leader, which a
  # child just forked can not be, and on success it returns a pid, never 0.
  'replace < with <= in spawn',
  'replace < with == in spawn',
  # Walking a child that starts exactly at `end` finds only a comment at that
  # very place, and `remove_spans` stops at `end`, so the text is the same:
  # the bound only saves the walk through a body.
  'replace < with <= in comments_in',
  # Waking the queue worker after a human proposal only shortens its wait:
  # the worker also wakes every 2 s and drains the same queue, so no test
  # can tell the two apart without timing.
  'delete match arm Op::ChangePropose\{\.\.\} in Service::human_submit',
  # Pruning old login nonces (`now - LOGIN_NONCE_WINDOW_MS`) only frees
  # memory: a nonce older than the window belongs to a signature that is
  # stale anyway and is refused before the nonce is looked at, so keeping
  # every nonce (what `now / WINDOW` amounts to) is not observable.
  'replace - with / in Service::login',
  # The CLI renews a kept session when it expires within 30 s of now
  # (`expires_ms > now + 30_000`). Whether the one millisecond of equality
  # renews or reuses is not observable: the clock has moved on by the time
  # the daemon answers.
  'replace > with >= in human_client',
  # Cutting a diff inside a UTF-8 character steps back to the character's
  # start; stepping forward instead lands on its end, and the partial
  # line after the cut is dropped either way, so the two can not be told
  # apart from the result.
  'replace -= with \+= in truncate_at_line',
  # A bundle whose encoded size is exactly the page budget: whether that
  # one byte of equality fits or not can not be arranged by a test (the
  # bundle's bytes are git's), and either answer is right.
  'replace > with >= in Service::trunk_bundle',
]
