name: mutants runner
description: The toolchain, the disk and the tools a mutation job needs.

runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    # A real sandbox: without one the tests of `lonca run` stop early and say
    # nothing of it. AppArmor blocks bwrap's unprivileged user namespaces on
    # ubuntu-latest (24.04).
    - name: Bubblewrap
      shell: bash
      run: |
        sudo apt-get install -y bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    # cargo-mutants builds up to two copies of the tree under /tmp, about 12 GB
    # with this workspace's debug targets. A runner with 14 GB free died of
    # ENOSPC (shard 2/6 of PR #88), so the preinstalled toolchains we never use
    # go when space is short. They take one to three minutes to delete, and
    # today's runners start with 86 GB free.
    - name: Free disk space
      shell: bash
      run: |
        df -h / | tail -1
        free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
        if [ "$free" -ge 30 ]; then
          echo "${free} GB free, enough"
          exit 0
        fi
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
          /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
        sudo docker image prune -af >/dev/null 2>&1 || true
        df -h / | tail -1
    - name: cargo-mutants
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-mutants@27.1.0,cargo-nextest@0.9.151
