version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Leave a new release a week to be yanked or flagged before it is proposed.
    cooldown:
      default-days: 7
  # The cargo-fuzz project has its own lock file (docs/fuzzing.md).
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
