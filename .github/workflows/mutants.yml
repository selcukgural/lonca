# Mutation testing (docs/decisions.md, "Mutation testing"; CLAUDE.md).
#
# On demand only, and it blocks nothing: no release, pull request or merge
# waits for it. It mutates only the files that hold the trust model
# (.cargo/mutants-gated.txt), and only what changed in them since the last
# release (`git diff <last v* tag>...HEAD`), each mutant against the whole
# workspace. Run it after a change to one of those files:
#
#   gh workflow run mutants.yml --ref main            # since the last v* tag
#   gh workflow run mutants.yml --ref main -f base=v0.2.0
#
# A survivor, or a timeout in those files, makes the run red; it is fixed
# with a test or excluded with a written reason (.cargo/mutants.toml), and
# every exclusion in them must be listed in .cargo/mutants-gated-exclusions.txt.
name: mutants

on:
  workflow_dispatch:
    inputs:
      base:
        description: "The tag or commit to diff against (default: the last v* tag)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What .cargo/mutants.toml excludes in a gated file, against the reviewed
  # list. Only lists mutants, so it takes a minute.
  exclusions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-mutants@27.1.0
      - run: .github/scripts/mutants-gate.sh exclusions

  # The diff of the gated files since the last release, its mutants, and how
  # many shards they need.
  plan:
    name: gated files changed since the last release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base: ${{ steps.diff.outputs.base }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `HEAD^`: a commit just tagged is diffed against the release before it,
      # not against itself.
      - name: The last release and the gated files' diff since
        id: diff
        env:
          BASE_INPUT: ${{ inputs.base }}
        run: |
          base=${BASE_INPUT:-$(git describe --tags --abbrev=0 --match 'v*' HEAD^)}
          case "$base" in
            -*|*[!A-Za-z0-9._/-]*) echo "::error::not a tag or commit: $base"; exit 1 ;;
          esac
          git rev-parse --verify --quiet --end-of-options "$base^{commit}" > /dev/null \
            || { echo "::error::no such tag or commit: $base"; exit 1; }
          mapfile -t gated < <(grep -v '^#' .cargo/mutants-gated.txt | sed '/^$/d')
          git diff "$base...HEAD" -- "${gated[@]}" > git.diff
          echo "since $base: $(grep -c '^diff --git' git.diff || true) gated files changed"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutants to run
        id: plan
        run: |
          cargo mutants --in-diff git.diff --list > mutants.txt
          count=$(sed '/^$/d' mutants.txt | wc -l)
          echo "$count mutants:"
          cat mutants.txt
          # Four a shard: each mutant pays a whole workspace run, a few
          # minutes, and two run at once.
          shards=$(((count + 3) / 4))
          [ "$shards" -le 20 ] || shards=20
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson n "$shards" '[range($n)]')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-plan
          path: |
            git.diff
            mutants.txt
          retention-days: 7

  run:
    name: mutants ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/mutants-runner
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-plan
      - name: Mutants of shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set +e
          cargo mutants --in-diff git.diff --shard "$SHARD/$SHARDS" --no-shuffle -j 2
          rc=$?
          set -e
          # 0 all caught, 2 missed, 3 timeouts; anything else is a run error.
          case $rc in 0|2|3) ;; *) echo "cargo mutants failed ($rc)"; exit 1 ;; esac
          caught=$(wc -l < mutants.out/caught.txt)
          timeouts=$(wc -l < mutants.out/timeout.txt)
          missed=$(wc -l < mutants.out/missed.txt)
          echo "missed: $missed, caught: $caught, timeouts: $timeouts, unviable: $(wc -l < mutants.out/unviable.txt)"
          if [ "$missed" -gt 0 ]; then
            {
              echo "### Survivors, shard $SHARD: $missed"
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::mutants survived: kill each with a test, or exclude it with a written reason"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14
          if-no-files-found: ignore

  # The score of each file's crate and of the gated files; fails on a missed
  # or timed-out mutant (a timeout there is a loop no test ends, or a test too
  # slow to tell).
  score:
    needs: [plan, run]
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-[0-9]*
          path: shards
      - name: Score and gate
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          mkdir -p shards
          set +e
          .github/scripts/mutants-gate.sh results shards/* > score.md
          rc=$?
          set -e
          { echo "### Mutation score of the gated files' changes since $BASE"; cat score.md; } >> "$GITHUB_STEP_SUMMARY"
          cat score.md
          exit $rc
