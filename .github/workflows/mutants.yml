# Mutation testing (docs/decisions.md, "Mutation testing"; CLAUDE.md).
#
# On a pull request only the mutants in the diff against the base branch
# run, and the job fails when any of them survives: this check is required
# on main. Weekly (and on demand) the whole workspace runs in shards and
# every shard's results are kept as an artifact.
name: mutants

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a pull request: the diff once, the mutants in it over six shards,
  # and one job named `mutants` that the ruleset requires and that fails
  # when any shard found a survivor. Each shard pays its own baseline
  # build (a few minutes) and then a sixth of the mutants.
  diff:
    name: changed Rust
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff against the base branch
        id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git diff "origin/$BASE...HEAD" -- crates > git.diff
          if [ -s git.diff ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no Rust changes; nothing to mutate"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: git-diff
          path: git.diff
          retention-days: 1

  shard:
    name: mutants ${{ matrix.shard }}/6
    needs: diff
    if: needs.diff.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # No bubblewrap, on purpose: the same environment as the `test` job
      # in ci.yml. On ubuntu-latest (24.04) AppArmor blocks bwrap's
      # unprivileged user namespaces, every sandboxed verification fails,
      # and the baseline run (not a mutant) fails in the concurrency test.
      # Sandboxed verification in CI is #54 / #59.
      # cargo-mutants builds up to two copies of the tree under /tmp; with
      # this workspace's debug targets the runner's disk runs out (shard
      # 2/6 of PR #88 died with ENOSPC). The preinstalled toolchains we
      # never use are the space.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
            /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: cargo-mutants
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: git-diff
      - name: Mutants in the diff, shard ${{ matrix.shard }} of 6
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          cargo mutants --in-diff git.diff --shard "$SHARD/6" --no-shuffle -j 2
          rc=$?
          set -e
          # 0 all caught, 2 missed, 3 timeouts (counted as caught, see
          # CLAUDE.md); anything else is a run error.
          case $rc in 0|2|3) ;; *) echo "cargo mutants failed ($rc)"; exit 1 ;; esac
      - name: Survivors fail the check
        run: |
          if [ -s mutants.out/missed.txt ]; then
            echo "::error::mutants survived in the diff; kill each with a test or exclude it with a written reason (.cargo/mutants.toml)"
            cat mutants.out/missed.txt
            exit 1
          fi
          echo "caught: $(wc -l < mutants.out/caught.txt), timeouts: $(wc -l < mutants.out/timeout.txt), unviable: $(wc -l < mutants.out/unviable.txt)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-diff-${{ matrix.shard }}
          path: mutants.out
          retention-days: 7
          if-no-files-found: ignore

  mutants:
    name: mutants
    needs: [diff, shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard caught its mutants
        env:
          DIFF: ${{ needs.diff.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "diff: $DIFF, shards: $SHARDS"
          case "$DIFF" in success) ;; *) echo "::error::the diff job failed"; exit 1 ;; esac
          case "$SHARDS" in success|skipped) ;; *) echo "::error::a shard found survivors or failed"; exit 1 ;; esac

  full:
    name: full ${{ matrix.shard }}/8
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # No bubblewrap, on purpose: the same environment as the `test` job
      # in ci.yml. On ubuntu-latest (24.04) AppArmor blocks bwrap's
      # unprivileged user namespaces, every sandboxed verification fails,
      # and the baseline run (not a mutant) fails in the concurrency test.
      # Sandboxed verification in CI is #54 / #59.
      # cargo-mutants builds up to two copies of the tree under /tmp; with
      # this workspace's debug targets the runner's disk runs out (shard
      # 2/6 of PR #88 died with ENOSPC). The preinstalled toolchains we
      # never use are the space.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
            /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: cargo-mutants
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutants, shard ${{ matrix.shard }} of 8
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          cargo mutants --shard "$SHARD/8" --no-shuffle -j 2
          rc=$?
          set -e
          case $rc in 0|2|3) ;; *) echo "cargo mutants failed ($rc)"; exit 1 ;; esac
          echo "missed: $(wc -l < mutants.out/missed.txt), caught: $(wc -l < mutants.out/caught.txt), timeouts: $(wc -l < mutants.out/timeout.txt), unviable: $(wc -l < mutants.out/unviable.txt)"
          # A survivor in a security-critical file is a regression.
          if grep -E 'decide\.rs|chain\.rs|state\.rs|oplog\.rs|canonical\.rs|changeid\.rs|keys\.rs|lonca-audit/|merge\.rs|integrate\.rs' mutants.out/missed.txt; then
            echo "::error::survivors in security-critical files"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-full-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14
