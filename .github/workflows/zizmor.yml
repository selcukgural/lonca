# Static analysis of the workflows themselves (template injection, unpinned
# actions, credentials left to later steps, excessive permissions). Fails on
# any finding above "low"; runs where a workflow changes.
name: zizmor

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          min-severity: medium
          # Report in the job; no SARIF upload, so no security-events write.
          advanced-security: false
