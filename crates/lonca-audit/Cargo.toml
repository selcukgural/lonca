[package]
name = "lonca-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Independent auditor of a Lonca repository: replays every decision of the signed operation log and recomputes its facts and merges"
keywords = ["vcs", "audit", "agents", "lonca"]
categories = ["development-tools"]

[dependencies]
lonca-core = { version = "0.2.1", path = "../lonca-core" }
lonca-policy = { version = "0.2.1", path = "../lonca-policy" }
lonca-symbols = { version = "0.2.1", path = "../lonca-symbols" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
