[package]
name = "lonca-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Lonca command line: daemon, workspaces, approvals, harness hook and MCP server"

[[bin]]
name = "lonca"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
libc = "0.2.190"
lonca-client = { version = "0.1.0", path = "../lonca-client", features = ["test-env"] }
lonca-core = { version = "0.1.0", path = "../lonca-core" }
lonca-daemon = { version = "0.1.0", path = "../lonca-daemon" }
lonca-policy = { version = "0.1.0", path = "../lonca-policy" }
lonca-symbols = { version = "0.1.0", path = "../lonca-symbols" }
lonca-verify = { version = "0.1.0", path = "../lonca-verify" }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
tempfile = "3.27.0"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
lonca-audit = { path = "../lonca-audit" }

[lints]
workspace = true
