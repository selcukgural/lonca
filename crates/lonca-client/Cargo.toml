[package]
name = "lonca-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Client of the Lonca daemon socket: protocol types, framing, daemon checks and the human session file"
keywords = ["vcs", "agents", "lonca", "client"]
categories = ["development-tools", "api-bindings"]

[features]
# Debug builds read the daemon's uid from LONCA_TEST_DAEMON_UID instead of
# the machine's file, for hermetic tests. Off unless asked for, and never in
# a release build: an agent can set an environment variable.
test-env = []

[dependencies]
libc = "0.2.190"
lonca-core = { version = "0.2.1", path = "../lonca-core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
