[package]
name = "lonca-core"
version = "0.1.0"
edition = "2024"
description = "Deterministic building blocks of Lonca: change ids, the signed operation log, keys and the Git store"
license = "Apache-2.0"
repository = "https://github.com/selcukgural/lonca"
keywords = ["vcs", "git", "agents", "oplog"]
categories = ["development-tools"]

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
gix = { version = "0.89.0", default-features = false, features = ["max-performance-safe", "revision", "index", "sha1"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
