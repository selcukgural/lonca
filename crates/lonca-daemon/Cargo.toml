[package]
name = "lonca-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "The Lonca daemon: the single writer every operation goes through (decide, sign, log, apply)"
keywords = ["vcs", "agents", "daemon", "lonca"]
categories = ["development-tools"]

[dependencies]
base64 = "0.23.1"
hex = "0.4.3"
libc = "0.2.190"
lonca-client = { version = "0.2.3", path = "../lonca-client", features = ["test-env"] }
lonca-core = { version = "0.2.3", path = "../lonca-core" }
lonca-net = { version = "0.2.3", path = "../lonca-net" }
lonca-policy = { version = "0.2.3", path = "../lonca-policy" }
lonca-symbols = { version = "0.2.3", path = "../lonca-symbols" }
lonca-verify = { version = "0.2.3", path = "../lonca-verify" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
ed25519-dalek = "3.0.0"
lonca-audit = { path = "../lonca-audit" }
p256 = { version = "0.14.0", features = ["ecdsa"] }
tempfile = "3.27.0"

[lints]
workspace = true
