[package]
name = "lonca-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "What each fuzz target checks (#15): run by cargo-fuzz from fuzz/, and by cargo test on every saved input"

[dependencies]
base64 = "0.23.1"
lonca-audit = { path = "../lonca-audit" }
lonca-client = { path = "../lonca-client" }
lonca-core = { path = "../lonca-core" }
lonca-daemon = { path = "../lonca-daemon" }
lonca-policy = { path = "../lonca-policy" }
lonca-symbols = { path = "../lonca-symbols" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
zeroize = "1.9.1"

[lints]
workspace = true
