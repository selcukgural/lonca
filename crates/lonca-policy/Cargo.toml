[package]
name = "lonca-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Lonca's deterministic decision layer: the pure decide() function, state replay, Cedar policies and human keys"
keywords = ["vcs", "policy", "cedar", "agents"]
categories = ["development-tools"]

[dependencies]
cedar-policy = "4.13.0"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
lonca-core = { version = "0.2.3", path = "../lonca-core" }
p256 = { version = "0.14.0", features = ["ecdsa"] }
sha2 = "0.11.1"
stacker = "0.1.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
base64 = "0.23.1"
hex = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdsa"] }
tempfile = "3.27.0"

[lints]
workspace = true
