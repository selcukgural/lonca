AfterTool = [{ matcher = "*", hooks = [{ type = "command", command = "lonca hook --harness gemini" }] }]
AfterAgent = [{ matcher = "*", hooks = [{ type = "command", command = "lonca hook --harness gemini --fail-open" }] }]

[gemini.tools]
read_file = { kind = "read", fields = ["file_path"] }
read_many_files = { kind = "read", fields = ["include"] }
list_directory = { kind = "read", fields = ["dir_path"] }
glob = { kind = "read", fields = ["dir_path"] }
grep_search = { kind = "read", fields = ["dir_path"] }
write_file = { kind = "write", fields = ["file_path"] }
replace = { kind = "write", fields = ["file_path"] }
run_shell_command = { kind = "shell", fields = ["command"] }
web_fetch = { kind = "fetch", fields = ["url", "prompt"] }
google_web_search = { kind = "search" }
activate_skill = { kind = "inert" }
ask_user = { kind = "inert" }
enter_plan_mode = { kind = "inert" }
exit_plan_mode = { kind = "inert" }
write_todos = { kind = "inert" }

[opencode]
events = { session_start = "session_start", before_tool = "before_tool", after_tool = "after_tool", stop = "stop" }
deny = { deny = "{reason}" }
context = { context = "{context}" }
stop_deny = { resume = "{reason}" }
mcp_prefix = ""
mcp_separator = "_"

[opencode.tools]
read = { kind = "read", fields = ["path", "filePath"] }
list = { kind = "read", fields = ["path"] }
glob = { kind = "read", fields = ["path"] }
grep = { kind = "read", fields = ["path"] }
write = { kind = "write", fields = ["path", "filePath"] }
edit = { kind = "write", fields = ["path", "filePath"] }
apply_patch = { kind = "write", fields = ["patchText"], headers = ["*** Add File: ", "*** Update File: ", "*** Delete File: ", "*** Move to: "] }
bash = { kind = "shell", fields = ["command"] }
shell = { kind = "shell", fields = ["command"] }
webfetch = { kind = "fetch", fields = ["url"] }
websearch = { kind = "search" }
codesearch = { kind = "search" }
task = { kind = "inert" }
todowrite = { kind = "inert" }
todoread = { kind = "inert" }
skill = { kind = "inert" }
question = { kind = "inert" }

# OpenCode has no command hooks: the plugin in setup calls `lonca hook`, with
# event names of our own. Its `execute` tool runs code, so it is left out of the
# table below: it taints, and a person approves what the session proposes.
[opencode.setup]
note = "OpenCode's execute tool runs code and is not described here, so a session that uses it is tainted and its changes need a person's approval. To decide otherwise, add it to [taint] safe_tools or to a profile of your own."

[opencode.setup.env]
LONCA_SOCKET = "{socket}"

[[opencode.setup.files]]
path = "opencode.json"
format = "json"

[opencode.setup.files.content]
instructions = [".opencode/lonca-rules.md"]
permission = { "lonca_*" = "allow" }
mcp = { lonca = { type = "local", command = ["lonca", "mcp"], cwd = "{workspace}", enabled = true, timeout = 120000, environment = { LONCA_SOCKET = "{socket}", LONCA_WORKSPACE = "{workspace}" } } }

[[opencode.setup.files]]
path = ".opencode/lonca-rules.md"
format = "text"
content = "{rules}"

[[opencode.setup.files]]
path = ".opencode/plugins/lonca.js"
format = "text"
content = '''
import { spawnSync } from "node:child_process";

// Bridges OpenCode's plugin hooks to `lonca hook`, which reads them with the
// [opencode] profile. A failure blocks the tool call.
export default {
  id: "lonca",
  async setup(ctx) {
    const directory = ctx.location.directory;
    const hook = (event) => {
      const r = spawnSync("lonca", ["hook", "--harness", "opencode"], {
        cwd: directory,
        input: JSON.stringify({ ...event, cwd: directory }),
        encoding: "utf8",
      });
      if (r.error) throw new Error(`lonca hook: ${r.error.message}`);
      if (r.status !== 0) throw new Error(r.stderr || `lonca hook exited ${r.status}`);
      const out = r.stdout.trim();
      const answer = out ? JSON.parse(out) : {};
      if (answer.deny) throw new Error(answer.deny);
    };
    const started = new Set();
    await ctx.tool.hook("execute.before", (event) => {
      if (!started.has(event.sessionID)) {
        started.add(event.sessionID);
        hook({ hook_event_name: "session_start", session_id: event.sessionID });
      }
      hook({ hook_event_name: "before_tool", tool_name: event.tool, tool_input: event.input, session_id: event.sessionID });
    });
    await ctx.tool.hook("execute.after", (event) => {
      hook({ hook_event_name: "after_tool", tool_name: event.tool, tool_input: event.input, session_id: event.sessionID });
    });
    // OpenCode has no stop hook to answer, so a turn that ended is prompted.
    // Not one a person interrupted or one that failed. Only a session that
    // used a tool can hold work, and a failure ends the turn.
    const stopped = (sessionID) => {
      const r = spawnSync("lonca", ["hook", "--harness", "opencode", "--fail-open"], {
        cwd: directory,
        input: JSON.stringify({ hook_event_name: "stop", session_id: sessionID, cwd: directory }),
        encoding: "utf8",
      });
      const out = (r.stdout ?? "").trim();
      return out ? JSON.parse(out).resume : undefined;
    };
    (async () => {
      for await (const event of ctx.event.subscribe({ types: ["session.execution.succeeded"] })) {
        const sessionID = event.data.sessionID;
        const text = started.has(sessionID) ? stopped(sessionID) : undefined;
        if (text) await ctx.session.prompt({ sessionID, text });
      }
    })().catch((e) => console.error(`lonca: ${e}`));
  },
};
'''
