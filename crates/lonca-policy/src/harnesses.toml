# What Lonca knows about each agent harness, as data. A repository adds or
# replaces one under `[harnesses.<name>]` in lonca.toml, with a signed policy
# update: a new harness needs no new Lonca. See docs/guide/runners.md.

[claude-code]
events = { session_start = "SessionStart", before_tool = "PreToolUse", after_tool = "PostToolUse", stop = "Stop" }
deny = { hookSpecificOutput = { hookEventName = "PreToolUse", permissionDecision = "deny", permissionDecisionReason = "{reason}" } }
context = { hookSpecificOutput = { hookEventName = "SessionStart", additionalContext = "{context}" } }
tool_context = { hookSpecificOutput = { hookEventName = "PostToolUse", additionalContext = "{context}" } }
stop_deny = { decision = "block", reason = "{reason}" }

[claude-code.setup]
flags = ["--mcp-config", { file = ".mcp.json" }, "--settings", { file = ".claude/settings.local.json" }]

[[claude-code.setup.files]]
path = ".mcp.json"
format = "json"
content = { mcpServers = { lonca = { command = "lonca", args = ["mcp"], env = { LONCA_SOCKET = "{socket}", LONCA_WORKSPACE = "{workspace}" } } } }

[[claude-code.setup.files]]
path = ".claude/settings.local.json"
format = "json"

[claude-code.setup.files.content]
enabledMcpjsonServers = ["lonca"]
env = { LONCA_SOCKET = "{socket}" }
permissions = { allow = ["mcp__lonca__*"] }

[claude-code.setup.files.content.hooks]
SessionStart = [{ matcher = "*", hooks = [{ type = "command", command = "lonca hook", onFailure = "block" }] }]
PreToolUse = [{ matcher = "*", hooks = [{ type = "command", command = "lonca hook", onFailure = "block" }] }]
PostToolUse = [{ matcher = "*", hooks = [{ type = "command", command = "lonca hook", onFailure = "block" }] }]
# Never "block": a failure here must end the turn, not keep it going.
Stop = [{ hooks = [{ type = "command", command = "lonca hook --fail-open" }] }]

[claude-code.tools]
Read = { kind = "read", fields = ["file_path"] }
NotebookRead = { kind = "read", fields = ["notebook_path"] }
Glob = { kind = "read", fields = ["path"] }
Grep = { kind = "read", fields = ["path"] }
LS = { kind = "read", fields = ["path"] }
Write = { kind = "write", fields = ["file_path"] }
Edit = { kind = "write", fields = ["file_path"] }
MultiEdit = { kind = "write", fields = ["file_path"] }
NotebookEdit = { kind = "write", fields = ["notebook_path"] }
Bash = { kind = "shell", fields = ["command"] }
PowerShell = { kind = "shell", fields = ["command"] }
WebFetch = { kind = "fetch", fields = ["url"] }
WebSearch = { kind = "search" }
Agent = { kind = "inert" }
AskUserQuestion = { kind = "inert" }
EnterPlanMode = { kind = "inert" }
ExitPlanMode = { kind = "inert" }
Skill = { kind = "inert" }
Task = { kind = "inert" }
TaskCreate = { kind = "inert" }
TaskGet = { kind = "inert" }
TaskList = { kind = "inert" }
TaskOutput = { kind = "inert" }
TaskStop = { kind = "inert" }
TaskUpdate = { kind = "inert" }
TodoWrite = { kind = "inert" }
ToolSearch = { kind = "inert" }

[codex]
events = { session_start = "SessionStart", before_tool = "PreToolUse", after_tool = "PostToolUse", stop = "Stop" }
deny = { hookSpecificOutput = { hookEventName = "PreToolUse", permissionDecision = "deny", permissionDecisionReason = "{reason}" } }
context = { hookSpecificOutput = { hookEventName = "SessionStart", additionalContext = "{context}" } }
tool_context = { hookSpecificOutput = { hookEventName = "PostToolUse", additionalContext = "{context}" } }
stop_deny = { decision = "block", reason = "{reason}" }

# Codex skips a project's .codex/ until a person trusts the directory, so a
# file in a new workspace does nothing: everything goes in as flags.
[codex.setup]
note = "Codex runs hooks only after a person reviews them with /hooks, or with --dangerously-bypass-hook-trust, which also runs any other hook you have unreviewed. Without them the rules and the MCP server still work."
flags = [
  "-c", "mcp_servers.lonca.command=lonca",
  "-c", "mcp_servers.lonca.args=[\"mcp\"]",
  "-c", "mcp_servers.lonca.cwd={workspace}",
  "-c", "mcp_servers.lonca.env.LONCA_SOCKET={socket}",
  "-c", "mcp_servers.lonca.env.LONCA_WORKSPACE={workspace}",
  "-c", "mcp_servers.lonca.default_tools_approval_mode=approve",
  "-c", "developer_instructions={rules}",
  "-c", "hooks.SessionStart=[{hooks=[{type=\"command\",command=\"lonca hook --harness codex\"}]}]",
  "-c", "hooks.PreToolUse=[{hooks=[{type=\"command\",command=\"lonca hook --harness codex\"}]}]",
  "-c", "hooks.PostToolUse=[{hooks=[{type=\"command\",command=\"lonca hook --harness codex\"}]}]",
  "-c", "hooks.Stop=[{hooks=[{type=\"command\",command=\"lonca hook --harness codex --fail-open\"}]}]",
]

[codex.setup.env]
LONCA_SOCKET = "{socket}"

[codex.tools]
Bash = { kind = "shell", fields = ["command"] }
apply_patch = { kind = "write", fields = ["command"], headers = ["*** Add File: ", "*** Update File: ", "*** Delete File: ", "*** Move to: "] }
Write = { kind = "write", fields = ["command"], headers = ["*** Add File: ", "*** Update File: ", "*** Delete File: ", "*** Move to: "] }
Edit = { kind = "write", fields = ["command"], headers = ["*** Add File: ", "*** Update File: ", "*** Delete File: ", "*** Move to: "] }
view_image = { kind = "read", fields = ["path"] }
spawn_agent = { kind = "inert" }
update_plan = { kind = "inert" }

[gemini]
events = { session_start = "SessionStart", before_tool = "BeforeTool", after_tool = "AfterTool", stop = "AfterAgent" }
deny = { decision = "deny", reason = "{reason}" }
context = { hookSpecificOutput = { hookEventName = "SessionStart", additionalContext = "{context}" } }
tool_context = { hookSpecificOutput = { hookEventName = "AfterTool", additionalContext = "{context}" } }
stop_deny = { decision = "deny", reason = "{reason}" }
mcp_prefix = "mcp_"
mcp_separator = "_"

[gemini.setup.env]
LONCA_SOCKET = "{socket}"
GEMINI_CLI_TRUST_WORKSPACE = "true"

[[gemini.setup.files]]
