[package]
name = "lonca-symbols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Symbols, facts and the structural merge of Lonca, pure functions of file contents (tree-sitter)"
keywords = ["vcs", "merge", "tree-sitter", "symbols"]
categories = ["development-tools"]

[dependencies]
aho-corasick = "1.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
diffy = "0.5.2"
lonca-core = { version = "0.2.2", path = "../lonca-core" }
similar = "3.2.0"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
lonca-tree-sitter-ruby = { version = "0.2.2", path = "../lonca-tree-sitter-ruby" }
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[lints]
workspace = true
