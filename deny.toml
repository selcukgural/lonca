# cargo-deny: run with `cargo deny check`. CI runs it on every push and pull request.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the check; a yanked release does too.
yanked = "deny"
ignore = []

[licenses]
# Everything Lonca ships must be compatible with Apache-2.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",             # uluru, through gix-pack; file-level copyleft, used unmodified
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions come from the ecosystem (windows-sys, syn); report them, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io. A git or alternative-registry dependency must be added here on purpose.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
