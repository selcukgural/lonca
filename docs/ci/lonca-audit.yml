# Example workflow for a repository that Lonca pushes to: every push is
# audited on infrastructure separate from the developer's machine.
# Copy to .github/workflows/lonca-audit.yml and set LONCA_VERSION to the
# release your daemon runs (or a later one: every release reads every older
# log). The release's archive is checked against its build provenance
# attestation before it runs; `cargo install --locked lonca-audit --version
# <V>` builds the same from crates.io instead.
#
# A log proves that it is whole and signed by its own daemon key. It can
# not prove that it is YOUR log, or your latest: whoever can push here
# could push another log, or an older state of this one, with refs to
# match. Two things from outside the log close that:
#   - LONCA_GENESIS, a repository variable (Settings > Secrets and
#     variables > Actions > Variables) holding the `genesis:` hash that
#     `lonca-audit verify` prints for your repository. Set it once. A
#     variable is changed by an administrator, not by a push.
#   - the `head:` of the last run on this branch, kept in the Actions
#     cache: the log must still have that entry. A cache written on
#     another branch is not read here.
# The job fails while LONCA_GENESIS is not set.
name: lonca-audit

on:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the Lonca refs (operation log, policy, proposals)
        run: git fetch --no-tags origin '+refs/lonca/*:refs/lonca/*'
      - name: Install lonca-audit from the release, attestation checked
        env:
          GH_TOKEN: ${{ github.token }}
          LONCA_VERSION: "0.2.0"
        run: |
          archive=lonca-x86_64-unknown-linux-musl.tar.gz
          gh release download "v$LONCA_VERSION" --repo selcukgural/lonca \
            --pattern "$archive" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$archive" --repo selcukgural/lonca \
            --signer-workflow selcukgural/lonca/.github/workflows/release.yml \
            --source-ref "refs/tags/v$LONCA_VERSION"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" lonca-audit
      - name: The head the log had at the last run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lonca-audit-head
          key: lonca-audit-head-${{ github.run_id }}
          restore-keys: lonca-audit-head-
      - name: Replay and verify every decision of the expected log
        env:
          LONCA_GENESIS: ${{ vars.LONCA_GENESIS }}
        run: |
          if [ -z "$LONCA_GENESIS" ]; then
            "$RUNNER_TEMP/lonca-audit" verify .git | grep '^genesis:' || true
            echo "::error::set the repository variable LONCA_GENESIS to your log's genesis hash (compare the line above with what lonca-audit prints on your own machine)"
            exit 1
          fi
          set -- verify .git --genesis "$LONCA_GENESIS"
          if [ -s lonca-audit-head ]; then
            set -- "$@" --extends "$(cat lonca-audit-head)"
          fi
          "$RUNNER_TEMP/lonca-audit" "$@" | tee audit.txt
          sed -n 's/^head: *//p' audit.txt > lonca-audit-head
      - name: Keep the head for the next run
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lonca-audit-head
          key: lonca-audit-head-${{ github.run_id }}
