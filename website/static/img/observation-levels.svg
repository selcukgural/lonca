<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Observation levels, from least to most proven: unobserved, hooks, hooks_sandbox and isolated. Claude Code reaches all four; other harnesses are unobserved with hooks and isolated under lonca run.">
  <!-- Lonca's observation levels. Its own dark ground, so it reads the same
       on a light and a dark page. -->
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e7c76a"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="22" fill="#11181a"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="22" fill="none" stroke="#2a3836"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="40" y="58" font-size="22" font-weight="700" fill="#eef3f2">Observation levels</text>
    <text x="1080" y="56" font-size="14" fill="#e7c76a" text-anchor="end">more is proven</text>
    <path d="M1090 51 H1158" stroke="#e7c76a" stroke-width="2" marker-end="url(#up)"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- unobserved -->
    <rect x="40" y="86" width="260" height="296" rx="16" fill="#0c1214" stroke="#2a3836"/>
    <text x="64" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e7c76a">unobserved</text>
    <g fill="#33413f"><circle cx="70" cy="146" r="6" fill="#e7c76a"/><circle cx="90" cy="146" r="6"/><circle cx="110" cy="146" r="6"/><circle cx="130" cy="146" r="6"/></g>
    <text x="64" y="184" font-size="15" fill="#eef3f2">Hooks the agent could edit,</text>
    <text x="64" y="206" font-size="15" fill="#eef3f2">or none at all.</text>
    <text x="64" y="240" font-size="14" fill="#93a3a0">Every change waits for a</text>
    <text x="64" y="260" font-size="14" fill="#93a3a0">person; critical paths are</text>
    <text x="64" y="280" font-size="14" fill="#93a3a0">refused unless policy asks.</text>
    <rect x="64" y="332" width="120" height="28" rx="14" fill="#1c2628" stroke="#33413f"/>
    <text x="124" y="351" font-size="13" fill="#eef3f2" text-anchor="middle">every harness</text>

    <!-- hooks -->
    <rect x="320" y="86" width="260" height="296" rx="16" fill="#0c1214" stroke="#2a3836"/>
    <text x="344" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e7c76a">hooks</text>
    <g fill="#33413f"><circle cx="350" cy="146" r="6" fill="#e7c76a"/><circle cx="370" cy="146" r="6" fill="#e7c76a"/><circle cx="390" cy="146" r="6"/><circle cx="410" cy="146" r="6"/></g>
    <text x="344" y="184" font-size="15" fill="#eef3f2">Hooks only an administrator</text>
    <text x="344" y="206" font-size="15" fill="#eef3f2">sets, and a failure blocks.</text>
    <text x="344" y="240" font-size="14" fill="#93a3a0">Managed, hooks-only settings,</text>
    <text x="344" y="260" font-size="14" fill="#93a3a0">in a file only root can write.</text>
    <rect x="344" y="332" width="120" height="28" rx="14" fill="#1c2628" stroke="#d97757"/>
    <text x="404" y="351" font-size="13" fill="#eef3f2" text-anchor="middle">Claude Code</text>

    <!-- hooks_sandbox -->
    <rect x="600" y="86" width="260" height="296" rx="16" fill="#0c1214" stroke="#2a3836"/>
    <text x="624" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e7c76a">hooks_sandbox</text>
    <g fill="#33413f"><circle cx="630" cy="146" r="6" fill="#e7c76a"/><circle cx="650" cy="146" r="6" fill="#e7c76a"/><circle cx="670" cy="146" r="6" fill="#e7c76a"/><circle cx="690" cy="146" r="6"/></g>
    <text x="624" y="184" font-size="15" fill="#eef3f2">Hooks locked, and the</text>
    <text x="624" y="206" font-size="15" fill="#eef3f2">harness's own sandbox too.</text>
    <text x="624" y="240" font-size="14" fill="#93a3a0">Its network goes through</text>
    <text x="624" y="260" font-size="14" fill="#93a3a0">Lonca's proxy. The hardened</text>
    <text x="624" y="280" font-size="14" fill="#93a3a0">installers set all of it up.</text>
    <rect x="624" y="332" width="120" height="28" rx="14" fill="#1c2628" stroke="#d97757"/>
    <text x="684" y="351" font-size="13" fill="#eef3f2" text-anchor="middle">Claude Code</text>

    <!-- isolated -->
    <rect x="880" y="86" width="280" height="296" rx="16" fill="#0c1214" stroke="#4fc1a6"/>
    <text x="904" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#4fc1a6">isolated</text>
    <g fill="#4fc1a6"><circle cx="910" cy="146" r="6"/><circle cx="930" cy="146" r="6"/><circle cx="950" cy="146" r="6"/><circle cx="970" cy="146" r="6"/></g>
    <text x="904" y="184" font-size="15" fill="#eef3f2">lonca run: Lonca's own</text>
    <text x="904" y="206" font-size="15" fill="#eef3f2">sandbox around the harness.</text>
    <text x="904" y="240" font-size="14" fill="#93a3a0">No hook needed. Nothing leaves</text>
    <text x="904" y="260" font-size="14" fill="#93a3a0">it but the socket and the proxy,</text>
    <text x="904" y="280" font-size="14" fill="#93a3a0">and every connection is logged.</text>
    <rect x="904" y="332" width="120" height="28" rx="14" fill="#1c2628" stroke="#33413f"/>
    <text x="964" y="351" font-size="13" fill="#eef3f2" text-anchor="middle">every harness</text>
  </g>
</svg>
